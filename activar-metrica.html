<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Activar Ledyvas Analytics Métrica</title>
<link rel="icon" href="/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .act-wrap { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; }
  .act-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
  .act-top img { height: 40px; }
  .act-top select { padding: 6px 10px; border-radius: 8px; border: 1px solid #d0d5dd; font: inherit; }
  .act-card { background: #fff; border: 1px solid #e4e7ec; border-radius: 14px; padding: 28px; box-shadow: 0 4px 18px rgba(15,23,42,.06); }
  .act-card h1 { font-size: 1.6rem; margin: 0 0 8px; }
  .act-card ol { padding-inline-start: 20px; margin: 16px 0 22px; }
  .act-card li { margin: 6px 0; }
  .act-card label { display: block; font-weight: 600; margin: 16px 0 6px; }
  .act-card input { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid #d0d5dd; border-radius: 10px; font: inherit; }
  #machine { font-family: Consolas, monospace; letter-spacing: 1px; text-transform: uppercase; direction: ltr; }
  .act-hint { color: #667085; font-size: .9rem; margin-top: 4px; }
  .act-msg { margin-top: 16px; padding: 12px 14px; border-radius: 10px; display: none; }
  .act-msg.err { display: block; background: #fef3f2; color: #b42318; }
  .act-key { display: none; margin-top: 18px; }
  .act-key textarea { width: 100%; box-sizing: border-box; min-height: 110px; font-family: Consolas, monospace; font-size: 13px; padding: 12px; border-radius: 10px; border: 1px solid #d0d5dd; direction: ltr; text-align: left; }
  .act-ok { background: #ecfdf3; color: #067647; padding: 12px 14px; border-radius: 10px; margin-bottom: 12px; }
  .act-card .btn { margin-top: 18px; }
  #move { width: 100%; white-space: normal; }
  .act-msg.ok { display: block; background: #ecfdf3; color: #067647; }
  [dir="rtl"] .act-card { text-align: right; }
</style>
</head>
<body>
<div class="act-wrap">
  <div class="act-top">
    <a href="/metrica.html" id="home"><img src="/assets/img/logo-icon.png" alt="Ledyvas"></a>
    <select id="lang" aria-label="Language">
      <option value="es">Español</option><option value="en">English</option><option value="it">Italiano</option>
      <option value="fr">Français</option><option value="pt">Português</option><option value="ar">العربية</option>
    </select>
  </div>
  <div class="act-card">
    <h1 data-t="title"></h1>
    <p data-t="intro"></p>
    <ol><li data-t="s1"></li><li data-t="s2"></li><li data-t="s3"></li></ol>
    <form id="f">
      <label for="machine" data-t="machine"></label>
      <input id="machine" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="24" required>
      <label for="name" data-t="name"></label>
      <input id="name" autocomplete="organization" maxlength="80">
      <div class="act-hint" data-t="nameHint"></div>
      <button class="btn btn-primary btn-lg" type="submit" id="go" data-t="btn"></button>
    </form>
    <div class="act-msg" id="msg"></div>
    <button class="btn btn-gold btn-lg" type="button" id="move" style="display:none" data-t="moveBtn"></button>
    <div class="act-key" id="keybox">
      <div class="act-ok" data-t="ok"></div>
      <textarea id="key" readonly></textarea>
      <button class="btn btn-outline" type="button" id="copy" data-t="copy"></button>
      <p class="act-hint" data-t="how"></p>
    </div>
  </div>
  <div class="act-card" id="lost" style="margin-top:18px;">
    <h2 style="font-size:1.15rem;margin:0 0 6px;" data-t="lostTitle"></h2>
    <p class="act-hint" data-t="lostText"></p>
    <form id="rf">
      <input id="remail" type="email" autocomplete="email" required placeholder="email@">
      <button class="btn btn-outline" type="submit" id="rgo" data-t="lostBtn"></button>
    </form>
    <div class="act-msg" id="rmsg"></div>
  </div>
  <p class="act-hint" style="text-align:center;margin-top:18px;" data-t="help"></p>
</div>
<script>
(function () {
  var API = 'https://ledyvas-license-server.ledyvas.workers.dev/metrica/activate';
  var T = {

    en: { moveBtn: "Move the license to this computer", e_other_machine: "This purchase is activated on another computer. If you changed PCs, click the button below: the license moves to this computer.", e_move_wait: "You changed computers recently. The next change is possible from {d}.", moved: "Done! The license moved to this computer. This is your new key; we also emailed it to you.", lostTitle: "Can’t find your activation link?", lostText: "Enter the email you used to buy and we will send it again.", lostBtn: "Send me my link", lostOk: "If that email has a purchase, the link will arrive in a few minutes. Check your spam folder too.", e_bad_email: "The email is not valid.", title: 'Activate your Métrica license', intro: 'Your purchase is confirmed. You just need to link the license to your computer.', s1: 'Install and open Ledyvas Analytics Métrica.', s2: 'Go to Settings › System › License and copy your machine code.', s3: 'Paste it here and click "Get my key".', machine: 'Machine code', name: 'Business name (shown on the license)', nameHint: 'Optional. If empty, the name from your purchase is used.', btn: 'Get my key', ok: 'Done! This is your key. We also emailed it to you.', copy: 'Copy key', copied: 'Copied', how: 'In Métrica: Settings › System › License › paste the key › "Activate license".', help: 'Need help? info@ledyvas.com', wait: 'One moment…', e_bad_link: 'This link is not valid. Open it from your purchase email.', e_bad_machine: 'The machine code is not valid: it has 16 letters or numbers.', e_revoked: 'This purchase was refunded or cancelled.', e_rate_limited: 'Too many attempts. Please try again tomorrow.', e_net: 'No connection. Check your internet and try again.' },
    it: { moveBtn: "Sposta la licenza su questo computer", e_other_machine: "Questo acquisto è attivato su un altro computer. Se hai cambiato PC, premi il pulsante qui sotto: la licenza passa su questo computer.", e_move_wait: "Hai cambiato computer da poco. Il prossimo cambio è possibile dal {d}.", moved: "Fatto! La licenza è passata su questo computer. Questa è la tua nuova chiave; te l’abbiamo inviata anche per email.", lostTitle: "Non trovi il tuo link di attivazione?", lostText: "Scrivi l’email usata per l’acquisto e te lo inviamo di nuovo.", lostBtn: "Inviami il link", lostOk: "Se quell’email ha un acquisto, il link arriva in pochi minuti. Controlla anche lo spam.", e_bad_email: "L’email non è valida.", title: 'Attiva la tua licenza di Métrica', intro: 'Il tuo acquisto è confermato. Manca solo collegare la licenza al tuo computer.', s1: 'Installa e apri Ledyvas Analytics Métrica.', s2: 'Vai su Impostazioni › Sistema › Licenza e copia il tuo codice macchina.', s3: 'Incollalo qui e premi "Ottieni la mia chiave".', machine: 'Codice macchina', name: 'Nome dell\'attività (appare sulla licenza)', nameHint: 'Facoltativo. Se vuoto, si usa il nome dell\'acquisto.', btn: 'Ottieni la mia chiave', ok: 'Fatto! Questa è la tua chiave. Te l\'abbiamo inviata anche per email.', copy: 'Copia chiave', copied: 'Copiata', how: 'In Métrica: Impostazioni › Sistema › Licenza › incolla la chiave › "Attiva licenza".', help: 'Serve aiuto? info@ledyvas.com', wait: 'Un momento…', e_bad_link: 'Il link non è valido. Aprilo dall\'email di acquisto.', e_bad_machine: 'Il codice macchina non è valido: sono 16 lettere o numeri.', e_revoked: 'Questo acquisto è stato rimborsato o annullato.', e_rate_limited: 'Troppi tentativi. Riprova domani.', e_net: 'Nessuna connessione. Controlla internet e riprova.' },
    fr: { moveBtn: "Transférer la licence sur cet ordinateur", e_other_machine: "Cet achat est activé sur un autre ordinateur. Si vous avez changé de PC, cliquez sur le bouton ci-dessous : la licence passe sur cet ordinateur.", e_move_wait: "Vous avez changé d’ordinateur récemment. Le prochain changement est possible à partir du {d}.", moved: "C’est fait ! La licence est passée sur cet ordinateur. Voici votre nouvelle clé ; nous vous l’avons aussi envoyée par e-mail.", lostTitle: "Vous ne trouvez pas votre lien d’activation ?", lostText: "Saisissez l’e-mail utilisé pour l’achat et nous vous le renverrons.", lostBtn: "M’envoyer mon lien", lostOk: "Si cet e-mail a un achat, le lien arrivera dans quelques minutes. Vérifiez aussi les spams.", e_bad_email: "L’e-mail n’est pas valide.", title: 'Activez votre licence Métrica', intro: 'Votre achat est confirmé. Il reste à lier la licence à votre ordinateur.', s1: 'Installez et ouvrez Ledyvas Analytics Métrica.', s2: 'Allez dans Paramètres › Système › Licence et copiez votre code machine.', s3: 'Collez-le ici et cliquez sur « Obtenir ma clé ».', machine: 'Code machine', name: 'Nom de l\'établissement (affiché sur la licence)', nameHint: 'Facultatif. S\'il est vide, le nom de l\'achat est utilisé.', btn: 'Obtenir ma clé', ok: 'C\'est fait ! Voici votre clé. Nous vous l\'avons aussi envoyée par e-mail.', copy: 'Copier la clé', copied: 'Copiée', how: 'Dans Métrica : Paramètres › Système › Licence › collez la clé › « Activer la licence ».', help: 'Besoin d\'aide ? info@ledyvas.com', wait: 'Un instant…', e_bad_link: 'Ce lien n\'est pas valide. Ouvrez-le depuis l\'e-mail d\'achat.', e_bad_machine: 'Le code machine n\'est pas valide : il comporte 16 lettres ou chiffres.', e_revoked: 'Cet achat a été remboursé ou annulé.', e_rate_limited: 'Trop de tentatives. Réessayez demain.', e_net: 'Pas de connexion. Vérifiez internet et réessayez.' },
    pt: { moveBtn: "Passar a licença para este computador", e_other_machine: "Esta compra está ativada em outro computador. Se você trocou de PC, clique no botão abaixo: a licença passa para este computador.", e_move_wait: "Você trocou de computador há pouco. A próxima troca é possível a partir de {d}.", moved: "Pronto! A licença passou para este computador. Esta é a sua nova chave; também a enviamos por e-mail.", lostTitle: "Não encontra o seu link de ativação?", lostText: "Digite o e-mail usado na compra e nós o enviamos de novo.", lostBtn: "Enviar meu link", lostOk: "Se esse e-mail tiver uma compra, o link chega em poucos minutos. Veja também o spam.", e_bad_email: "O e-mail não é válido.", title: 'Ative sua licença do Métrica', intro: 'Sua compra está confirmada. Só falta vincular a licença ao seu computador.', s1: 'Instale e abra o Ledyvas Analytics Métrica.', s2: 'Vá em Configurações › Sistema › Licença e copie o seu código do equipamento.', s3: 'Cole-o aqui e clique em "Obter minha chave".', machine: 'Código do equipamento', name: 'Nome do negócio (aparece na licença)', nameHint: 'Opcional. Se ficar vazio, usamos o nome da compra.', btn: 'Obter minha chave', ok: 'Pronto! Esta é a sua chave. Também a enviamos por e-mail.', copy: 'Copiar chave', copied: 'Copiada', how: 'No Métrica: Configurações › Sistema › Licença › cole a chave › "Ativar licença".', help: 'Precisa de ajuda? info@ledyvas.com', wait: 'Um momento…', e_bad_link: 'O link não é válido. Abra-o pelo e-mail da compra.', e_bad_machine: 'O código do equipamento não é válido: são 16 letras ou números.', e_revoked: 'Esta compra foi reembolsada ou cancelada.', e_rate_limited: 'Muitas tentativas. Tente de novo amanhã.', e_net: 'Sem conexão. Verifique a internet e tente de novo.' },
    ar: { moveBtn: "نقل الترخيص إلى هذا الحاسوب", e_other_machine: "هذه العملية مفعّلة على حاسوب آخر. إذا غيّرت الحاسوب، اضغط الزر أدناه لنقل الترخيص إلى هذا الحاسوب.", e_move_wait: "غيّرت الحاسوب مؤخرًا. يمكن إجراء التغيير التالي بدءًا من {d}.", moved: "تم! انتقل الترخيص إلى هذا الحاسوب. هذا مفتاحك الجديد، وأرسلناه إليك أيضًا بالبريد.", lostTitle: "لا تجد رابط التفعيل؟", lostText: "اكتب البريد الذي اشتريت به وسنرسله إليك مجددًا.", lostBtn: "أرسل لي الرابط", lostOk: "إذا كان لهذا البريد عملية شراء، سيصلك الرابط خلال دقائق. تحقق أيضًا من البريد غير المرغوب فيه.", e_bad_email: "البريد الإلكتروني غير صالح.", title: 'فعّل ترخيص Métrica', intro: 'تم تأكيد عملية الشراء. بقي فقط ربط الترخيص بحاسوبك.', s1: 'ثبّت Ledyvas Analytics Métrica وافتحه.', s2: 'انتقل إلى الإعدادات › النظام › الترخيص وانسخ رمز الجهاز.', s3: 'الصقه هنا واضغط "احصل على مفتاحي".', machine: 'رمز الجهاز', name: 'اسم المنشأة (يظهر في الترخيص)', nameHint: 'اختياري. إذا تُرك فارغًا يُستخدم اسم الشراء.', btn: 'احصل على مفتاحي', ok: 'تم! هذا مفتاحك. أرسلناه إليك أيضًا بالبريد الإلكتروني.', copy: 'نسخ المفتاح', copied: 'تم النسخ', how: 'في Métrica: الإعدادات › النظام › الترخيص › الصق المفتاح › "تفعيل الترخيص".', help: 'تحتاج مساعدة؟ info@ledyvas.com', wait: 'لحظة…', e_bad_link: 'الرابط غير صالح. افتحه من رسالة الشراء.', e_bad_machine: 'رمز الجهاز غير صالح: يتكون من 16 حرفًا أو رقمًا.', e_revoked: 'تم استرداد هذه العملية أو إلغاؤها.', e_rate_limited: 'محاولات كثيرة. حاول مجددًا غدًا.', e_net: 'لا يوجد اتصال. تحقق من الإنترنت وحاول مجددًا.' }
  };
  var HOME = { es: '/metrica.html', en: '/en/metrica.html', it: '/it/metrica.html', fr: '/fr/metrica.html', pt: '/pt/metrica.html', ar: '/ar/metrica.html' };
  var q = new URLSearchParams(location.search);
  var order = q.get('o') || '', token = q.get('t') || '';
  var nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
  var lang = T[q.get('l')] ? q.get('l') : (T[nav] ? nav : 'en');
  var $ = function (id) { return document.getElementById(id); };
  function apply() {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t.title;
    [].forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = t[el.getAttribute('data-t')]; });
    $('lang').value = lang;
    $('home').href = HOME[lang];
    if (!order || !token) { $('f').style.display = 'none'; showErr('bad_link'); }
  }
  function showErr(code, d) { var m = $('msg'); m.className = 'act-msg err'; m.textContent = (T[lang]['e_' + code] || T[lang].e_net).replace('{d}', d || ''); $('move').style.display = code === 'other_machine' ? 'inline-block' : 'none'; }
  function activate(move) {
    var go = $('go'); go.disabled = true; $('move').disabled = true; go.textContent = T[lang].wait; $('msg').className = 'act-msg';
    fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ o: order, t: token, machine: $('machine').value, name: $('name').value, lang: lang, move: !!move }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok && d.key) {
          $('key').value = d.key; $('keybox').style.display = 'block'; $('f').style.display = 'none'; $('move').style.display = 'none';
          if (d.moved) $('keybox').querySelector('.act-ok').textContent = T[lang].moved;
        } else showErr(d && d.error, d && d.nextMoveAt);
      })
      .catch(function () { showErr('net'); })
      .then(function () { go.disabled = false; $('move').disabled = false; go.textContent = T[lang].btn; });
  }
  $('move').addEventListener('click', function () { activate(true); });
  $('rf').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var b = $('rgo'), m = $('rmsg'); b.disabled = true;
    fetch(API.replace('/activate', '/resend'), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email: $('remail').value, lang: lang }) })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.ok) { m.className = 'act-msg ok'; m.textContent = T[lang].lostOk; } else { m.className = 'act-msg err'; m.textContent = T[lang]['e_' + (d && d.error)] || T[lang].e_net; } })
      .catch(function () { m.className = 'act-msg err'; m.textContent = T[lang].e_net; })
      .then(function () { b.disabled = false; });
  });
  $('lang').addEventListener('change', function () { lang = this.value; apply(); });
  $('f').addEventListener('submit', function (ev) { ev.preventDefault(); activate(false); });
  $('copy').addEventListener('click', function () {
    var k = $('key'); k.select();
    (navigator.clipboard ? navigator.clipboard.writeText(k.value) : Promise.reject()).catch(function () { document.execCommand('copy'); });
    this.textContent = T[lang].copied;
  });
  apply();
})();
</script>
</body>
</html>
