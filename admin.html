<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel de Administración — Ledyvas</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/distribuidores.css">
</head>
<body>

<div class="d-preview" data-i18n="previewBanner"></div>

<header class="d-header">
  <div class="d-wrap">
    <div>
      <div class="d-brand">
        <img src="assets/img/logo-icon.png" alt="Ledyvas">
        <div class="d-brand-txt">Ledyvas<span data-i18n="admin.title"></span></div>
      </div>
      <h1 data-i18n="admin.title"></h1>
      <p class="d-sub" data-i18n="admin.sub"></p>
    </div>
    <div class="d-lang" id="adm-lang"></div>
  </div>
</header>

<main class="d-wrap">

  <div class="d-kpis" id="adm-kpis"></div>

  <div class="d-card">
    <div class="d-card-head"><h2 data-i18n="admin.app.title"></h2></div>
    <div class="d-table-scroll">
      <table class="d-table">
        <thead>
          <tr>
            <th data-i18n="admin.app.col.date"></th>
            <th data-i18n="admin.app.col.name"></th>
            <th data-i18n="admin.app.col.role"></th>
            <th data-i18n="admin.app.col.country"></th>
            <th data-i18n="admin.app.col.contact"></th>
            <th data-i18n="admin.app.col.status"></th>
            <th data-i18n="admin.col.actions"></th>
          </tr>
        </thead>
        <tbody id="adm-apps"></tbody>
      </table>
    </div>
  </div>

  <div class="d-card">
    <div class="d-card-head">
      <h2 data-i18n="admin.distributors"></h2>
      <div class="d-card-actions">
        <button class="d-btn" id="adm-export" data-i18n="admin.export"></button>
        <button class="d-btn primary" id="adm-new" data-i18n="admin.new"></button>
      </div>
    </div>
    <div class="d-table-scroll">
      <table class="d-table">
        <thead>
          <tr>
            <th data-i18n="admin.col.name"></th>
            <th data-i18n="admin.col.code"></th>
            <th data-i18n="admin.col.region"></th>
            <th class="num" data-i18n="admin.col.sales"></th>
            <th class="num" data-i18n="admin.col.earned"></th>
            <th class="num" data-i18n="admin.col.pending"></th>
            <th data-i18n="admin.col.status"></th>
            <th data-i18n="admin.col.actions"></th>
          </tr>
        </thead>
        <tbody id="adm-rows"></tbody>
      </table>
    </div>
  </div>

  <p class="d-foot"><a href="/" data-i18n="back"></a></p>
</main>

<!-- Modal: nuevo distribuidor -->
<div class="d-modal-bg" id="adm-modal-bg">
  <div class="d-modal">
    <h3 data-i18n="admin.form.new"></h3>
    <form id="adm-form">
      <div class="d-field"><label data-i18n="admin.form.name"></label><input type="text" name="name" required></div>
      <div class="d-field"><label data-i18n="admin.form.email"></label><input type="email" name="email" required></div>
      <div class="d-field"><label data-i18n="admin.form.region"></label><input type="text" name="region"></div>
      <div class="d-field"><label data-i18n="admin.form.payment"></label>
        <select name="payment">
          <option>PayPal</option>
          <option>Wise</option>
          <option>Wire / transferencia</option>
        </select>
      </div>
      <div class="d-field"><label data-i18n="admin.form.commission"></label><input type="number" name="commission" value="15" min="0" max="100" step="1"></div>
      <div class="d-modal-actions">
        <button type="button" class="d-btn" id="adm-cancel" data-i18n="admin.form.cancel"></button>
        <button type="submit" class="d-btn primary" data-i18n="admin.form.create"></button>
      </div>
    </form>
  </div>
</div>

<div class="d-toast" id="adm-toast"></div>

<script src="assets/js/distribuidores-i18n.js"></script>
<script>
(function () {
  "use strict";
  var T = window.DistI18n;

  // ------------------------------------------------------------------
  // DATOS — de ejemplo. Después del 27-sep se reemplaza por llamadas al
  // Worker: GET /admin?t=token (lista), POST /admin/distributor (alta),
  // POST /admin/distributor/:code/pause, POST /admin/commission/mark-paid.
  // ------------------------------------------------------------------
  var DATA = {
    kpis: { activeDistributors: 4, salesMonth: 9, salesTotal: 34, commDue: 1863 },
    // Solicitudes pendientes de verificación. Después del 27-sep:
    //   GET  /admin/applications?t=token
    //   POST /admin/applications/:id/approve  → genera token de firma + email
    //   POST /admin/applications/:id/reject
    applications: [
      { id: "a1", date: "2026-09-04", name: "Lucía Fernández",      role: "vendedor",     country: "España",          contact: "lucia.f@example.com", status: "pending",  screening: { veredicto: "apto",      nota_admin: "Contadora con 4 años en un estudio, ya vende Alegra a PYMEs de hostelería. Entiende SaaS. Plan de captación concreto. Riesgo bajo." } },
      { id: "a2", date: "2026-09-03", name: "Contadores Pérez SRL", role: "distribuidor", country: "Rep. Dominicana", contact: "info@perezsrl.do",    status: "pending",  screening: { veredicto: "a_revisar", nota_admin: "Estudio contable real con ~30 clientes, pero nunca revendió software y no detalla quién daría soporte. Pedir aclaración antes de avanzar." } },
      { id: "a3", date: "2026-09-02", name: "Rahul Mehta",          role: "vendedor",     country: "India",           contact: "rahul.m@example.com", status: "contract", screening: { veredicto: "apto",      nota_admin: "5 años vendiendo SaaS B2B, cartera de restaurantes. Sólido." } },
      { id: "a4", date: "2026-08-30", name: "SoftStore Lisboa Lda", role: "distribuidor", country: "Portugal",        contact: "geral@softstore.pt",  status: "signed",   screening: { veredicto: "apto",      nota_admin: "Reseller de software con equipo técnico y referencias comerciales verificables." } }
    ],
    distributors: [
      { name: "María Reyes",      code: "MARIA-DR",   region: "Rep. Dominicana", sales: 11, earned: 2235, pending: 745, status: "active" },
      { name: "Carlos Núñez",     code: "CNUNEZ-MX",  region: "México",          sales: 8,  earned: 1642, pending: 523, status: "active" },
      { name: "Priya Nair",       code: "PNAIR-IN",   region: "India",           sales: 9,  earned: 1341, pending: 447, status: "active" },
      { name: "James O'Brien",    code: "JOB-UK",     region: "Reino Unido",     sales: 4,  earned: 892,  pending: 148, status: "active" },
      { name: "Ana Duarte",       code: "ADUARTE-PT", region: "Portugal",        sales: 2,  earned: 298,  pending: 0,   status: "paused" }
    ]
  };

  function money(n) { return T.t("money") + " " + Number(n || 0).toLocaleString(T.lang() === "en" ? "en-US" : T.lang()); }

  function applyStaticI18n() {
    document.documentElement.lang = T.lang();
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = T.t(el.getAttribute("data-i18n")); });
    document.title = T.t("admin.title") + " — Ledyvas";
  }

  function renderLang() {
    var box = document.getElementById("adm-lang");
    box.innerHTML = "";
    T.SUPPORTED.forEach(function (code) {
      var b = document.createElement("button");
      b.textContent = code;
      if (code === T.lang()) b.setAttribute("aria-current", "true");
      b.addEventListener("click", function () { T.setLang(code); });
      box.appendChild(b);
    });
  }

  function renderKpis() {
    var k = DATA.kpis;
    var defs = [
      { label: "admin.kpi.active",     value: k.activeDistributors },
      { label: "admin.kpi.salesMonth", value: k.salesMonth, cls: "accent" },
      { label: "admin.kpi.commDue",    value: money(k.commDue), cls: "warn" },
      { label: "admin.kpi.salesTotal", value: k.salesTotal }
    ];
    var grid = document.getElementById("adm-kpis");
    grid.innerHTML = "";
    defs.forEach(function (d) {
      var card = document.createElement("div");
      card.className = "d-kpi" + (d.cls ? " " + d.cls : "");
      card.innerHTML = '<div class="k-label"></div><div class="k-value"></div>';
      card.querySelector(".k-label").textContent = T.t(d.label);
      card.querySelector(".k-value").textContent = d.value;
      grid.appendChild(card);
    });
  }

  function recomputeKpis() {
    DATA.kpis.activeDistributors = DATA.distributors.filter(function (x) { return x.status === "active"; }).length;
    DATA.kpis.commDue = DATA.distributors.reduce(function (a, x) { return a + (x.pending || 0); }, 0);
    DATA.kpis.salesTotal = DATA.distributors.reduce(function (a, x) { return a + (x.sales || 0); }, 0);
  }

  function fmtDate(iso) {
    try { return new Date(iso + "T00:00:00").toLocaleDateString(T.lang() === "en" ? "en-GB" : T.lang(), { day: "2-digit", month: "short", year: "numeric" }); }
    catch (e) { return iso; }
  }

  function appStatusBadge(s) {
    var span = document.createElement("span");
    if (s === "pending") { span.className = "d-badge trial"; span.textContent = T.t("admin.app.status.pending"); }
    else if (s === "contract") { span.className = "d-badge never"; span.textContent = T.t("admin.app.status.contract"); }
    else { span.className = "d-badge active"; span.textContent = T.t("admin.app.status.signed"); }
    return span;
  }

  function renderApps() {
    var tb = document.getElementById("adm-apps");
    tb.innerHTML = "";
    var list = DATA.applications || [];
    if (!list.length) {
      tb.innerHTML = '<tr><td colspan="7"><div class="d-empty">' + T.t("admin.app.empty") + "</div></td></tr>";
      return;
    }
    list.forEach(function (a) {
      var tr = document.createElement("tr");
      function td(txt, cls) { var e = document.createElement("td"); if (cls) e.className = cls; e.textContent = txt; return e; }
      tr.appendChild(td(fmtDate(a.date)));
      tr.appendChild(td(a.name));

      var rl = document.createElement("td");
      var rb = document.createElement("span");
      rb.className = "d-badge " + (a.role === "distribuidor" ? "active" : "trial");
      rb.textContent = T.t("admin.app.role." + a.role);
      rl.appendChild(rb);
      tr.appendChild(rl);

      tr.appendChild(td(a.country || "—"));
      tr.appendChild(td(a.contact || "—"));

      var st = document.createElement("td");
      st.appendChild(appStatusBadge(a.status));
      if (a.screening && a.screening.veredicto) {
        var v = a.screening.veredicto;
        var sb = document.createElement("span");
        sb.className = "d-badge " + (v === "apto" ? "active" : v === "no_cumple" ? "expired" : "trial");
        sb.style.marginLeft = "6px";
        sb.textContent = T.t("admin.app.screening") + ": " + T.t("admin.app.scr." + v);
        if (a.screening.nota_admin) sb.title = a.screening.nota_admin;
        st.appendChild(sb);
        if (a.screening.nota_admin) {
          var note = document.createElement("div");
          note.style.cssText = "font-size:12px;color:var(--gray-500);margin-top:5px;max-width:340px;line-height:1.4";
          note.textContent = a.screening.nota_admin;
          st.appendChild(note);
        }
      }
      tr.appendChild(st);

      var act = document.createElement("td");
      var view = document.createElement("a");
      view.className = "d-btn link";
      view.textContent = T.t("admin.app.view");
      view.href = "contrato.html?rol=" + a.role + "&t=DEMO-TOKEN";
      view.target = "_blank"; view.rel = "noopener";
      act.appendChild(view);

      if (a.status === "pending") {
        var ap = document.createElement("button");
        ap.className = "d-btn link";
        ap.textContent = T.t("admin.app.approve");
        ap.addEventListener("click", function () {
          a.status = "contract"; renderApps();
          toast(T.t("admin.app.approved", { name: a.name }));
          // TODO 27-sep: POST /admin/applications/:id/approve
        });
        act.appendChild(ap);

        var rj = document.createElement("button");
        rj.className = "d-btn link";
        rj.style.color = "var(--bad)";
        rj.textContent = T.t("admin.app.reject");
        rj.addEventListener("click", function () {
          DATA.applications = DATA.applications.filter(function (x) { return x.id !== a.id; });
          renderApps();
          toast(T.t("admin.app.rejected", { name: a.name }));
          // TODO 27-sep: POST /admin/applications/:id/reject
        });
        act.appendChild(rj);
      }
      tr.appendChild(act);

      tb.appendChild(tr);
    });
  }

  function toast(msg) {
    var el = document.getElementById("adm-toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }

  function renderRows() {
    var tb = document.getElementById("adm-rows");
    tb.innerHTML = "";
    DATA.distributors.forEach(function (d, i) {
      var tr = document.createElement("tr");

      function td(txt, cls) { var e = document.createElement("td"); if (cls) e.className = cls; e.textContent = txt; return e; }
      tr.appendChild(td(d.name));
      var code = td(d.code); code.style.fontFamily = 'ui-monospace, "SF Mono", Menlo, monospace'; code.style.fontSize = "12.5px"; tr.appendChild(code);
      tr.appendChild(td(d.region || "—"));
      tr.appendChild(td(String(d.sales), "num"));
      tr.appendChild(td(money(d.earned), "num"));
      tr.appendChild(td(d.pending ? money(d.pending) : "—", "num"));

      var st = document.createElement("td");
      var badge = document.createElement("span");
      badge.className = "d-badge " + (d.status === "active" ? "active" : "paused");
      badge.textContent = T.t(d.status === "active" ? "admin.status.active" : "admin.status.paused");
      st.appendChild(badge);
      tr.appendChild(st);

      var act = document.createElement("td");
      if (d.pending > 0) {
        var pay = document.createElement("button");
        pay.className = "d-btn link"; pay.textContent = T.t("admin.act.markPaid");
        pay.addEventListener("click", function () {
          d.pending = 0; recomputeKpis(); renderKpis(); renderRows();
          toast(T.t("admin.paidDone", { name: d.name }));
        });
        act.appendChild(pay);
      }
      var toggle = document.createElement("button");
      toggle.className = "d-btn link";
      toggle.textContent = T.t(d.status === "active" ? "admin.act.pause" : "admin.act.resume");
      toggle.addEventListener("click", function () {
        d.status = d.status === "active" ? "paused" : "active";
        recomputeKpis(); renderKpis(); renderRows();
        toast(T.t(d.status === "active" ? "admin.resumed" : "admin.paused", { name: d.name }));
      });
      act.appendChild(toggle);
      tr.appendChild(act);

      tb.appendChild(tr);
    });
  }

  // ---- new distributor modal ----
  var mbg = document.getElementById("adm-modal-bg");
  document.getElementById("adm-new").addEventListener("click", function () { mbg.classList.add("open"); });
  document.getElementById("adm-cancel").addEventListener("click", function () { mbg.classList.remove("open"); });
  mbg.addEventListener("click", function (e) { if (e.target === mbg) mbg.classList.remove("open"); });

  document.getElementById("adm-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target;
    var name = f.name.value.trim();
    var slug = name.toUpperCase().replace(/[^A-Z0-9]+/g, "").slice(0, 8) || "DIST";
    var rand = Math.random().toString(36).slice(2, 5).toUpperCase();
    var code = slug + "-" + rand;
    DATA.distributors.unshift({
      name: name, code: code, region: f.region.value.trim(),
      sales: 0, earned: 0, pending: 0, status: "active"
    });
    // TODO 27-sep: POST al Worker → crea el registro, genera token, dispara el email de bienvenida con el link /panel?t=token
    f.reset(); f.commission.value = "15";
    mbg.classList.remove("open");
    recomputeKpis(); renderKpis(); renderRows();
    toast(T.t("admin.created", { code: code }));
  });

  // ---- export CSV ----
  document.getElementById("adm-export").addEventListener("click", function () {
    var head = [T.t("admin.col.name"), T.t("admin.col.code"), T.t("admin.col.region"), T.t("admin.col.sales"), T.t("admin.col.earned"), T.t("admin.col.pending"), T.t("admin.col.status")];
    var rows = DATA.distributors.map(function (d) {
      return [d.name, d.code, d.region, d.sales, d.earned, d.pending, T.t(d.status === "active" ? "admin.status.active" : "admin.status.paused")];
    });
    var csv = "﻿" + [head].concat(rows).map(function (r) {
      return r.map(function (c) { c = String(c == null ? "" : c); return /[",\n;]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(",");
    }).join("\r\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "distribuidores-ledyvas.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  applyStaticI18n();
  renderLang();
  recomputeKpis();
  renderKpis();
  renderApps();
  renderRows();
})();
</script>
</body>
</html>
