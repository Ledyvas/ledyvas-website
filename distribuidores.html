<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Vendé Ledyvas a tus clientes PYME y cobrá comisión. Vendedor 15% (gratis) o Distribuidor Oficial 20%. El programa abre el domingo 27 de septiembre de 2026 — dejá tu solicitud ahora.">
<title>Programa de Distribución — Ledyvas</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/distribuidores.css">
</head>
<body>

<div class="d-preview" data-i18n="pub.launchBanner"></div>

<header class="d-header">
  <div class="d-wrap">
    <div>
      <div class="d-brand">
        <img src="assets/img/logo-icon.png" alt="Ledyvas">
        <div class="d-brand-txt">Ledyvas<span data-i18n="pub.brandTag"></span></div>
      </div>
      <h1 id="pg-title"></h1>
      <p class="d-sub" id="pg-sub"></p>
    </div>
    <div class="d-lang" id="pg-lang"></div>
  </div>
</header>

<main class="d-wrap">

  <!-- ============ VISTA 1: elección de rol ============ -->
  <section id="view-choose" hidden>
    <p class="d-lead" data-i18n="pub.lead"></p>

    <div class="d-roles">
      <div class="d-role-card">
        <h3 data-i18n="pub.role.vendedor.t"></h3>
        <p data-i18n="pub.role.vendedor.d"></p>
        <a class="d-btn primary" href="?rol=vendedor" data-i18n="pub.apply"></a>
      </div>
      <div class="d-role-card">
        <h3 data-i18n="pub.role.distribuidor.t"></h3>
        <p data-i18n="pub.role.distribuidor.d"></p>
        <a class="d-btn primary" href="?rol=distribuidor" data-i18n="pub.apply"></a>
      </div>
    </div>

    <div class="d-card" style="margin-top:34px">
      <div class="d-card-head"><h2 data-i18n="pub.how.t"></h2></div>
      <div style="padding:6px 20px 20px">
        <ol class="d-steps">
          <li data-i18n="pub.how.1"></li>
          <li data-i18n="pub.how.2"></li>
          <li data-i18n="pub.how.3"></li>
          <li data-i18n="pub.how.4"></li>
          <li data-i18n="pub.how.5"></li>
        </ol>
      </div>
    </div>

    <div class="d-card" style="margin-top:26px">
      <div class="d-card-head"><h2 data-i18n="pub.demo.t"></h2></div>
      <div style="padding:6px 20px 20px">
        <p data-i18n="pub.demo.d"></p>
        <p style="margin-top:12px"><a class="d-btn small" href="descargas.html" data-i18n="pub.demo.trialBtn"></a></p>
        <p style="margin-top:18px" data-i18n="pub.demo.contractsIntro"></p>
        <p style="margin-top:8px">
          <a class="d-btn small" href="contrato.html?rol=vendedor" data-i18n="pub.demo.readVendedor"></a>
          <a class="d-btn small" href="contrato.html?rol=distribuidor" data-i18n="pub.demo.readDistribuidor" style="margin-left:8px"></a>
        </p>
      </div>
    </div>

    <div class="d-card" style="margin-top:26px">
      <div class="d-card-head"><h2 data-i18n="pub.flow.t"></h2></div>
      <div style="padding:6px 20px 20px">
        <ol class="d-steps">
          <li data-i18n="pub.flow.1"></li>
          <li data-i18n="pub.flow.2"></li>
          <li data-i18n="pub.flow.3"></li>
          <li data-i18n="pub.flow.4"></li>
        </ol>
        <p style="margin-top:12px" data-i18n="pub.flow.panelIntro"></p>
        <p style="margin-top:8px"><a class="d-btn small" href="panel.html" data-i18n="pub.flow.panelBtn"></a></p>
        <p class="d-note" style="margin-top:16px" data-i18n="pub.flow.prices"></p>
      </div>
    </div>

    <div class="d-card" style="margin-top:26px">
      <div class="d-card-head"><h2 data-i18n="pub.faq.t"></h2></div>
      <div class="d-faq" style="padding:6px 20px 14px">
        <details><summary data-i18n="pub.faq.q1"></summary><p data-i18n="pub.faq.a1"></p></details>
        <details><summary data-i18n="pub.faq.q2"></summary><p data-i18n="pub.faq.a2"></p></details>
        <details><summary data-i18n="pub.faq.q3"></summary><p data-i18n="pub.faq.a3"></p></details>
        <details><summary data-i18n="pub.faq.q4"></summary><p data-i18n="pub.faq.a4"></p></details>
        <details><summary data-i18n="pub.faq.q5"></summary><p data-i18n="pub.faq.a5"></p></details>
      </div>
    </div>
  </section>

  <!-- ============ VISTA 2: formulario ============ -->
  <section id="view-form" hidden>
    <p class="d-lead" id="frm-intro"></p>
    <p style="margin-top:10px"><a class="d-btn small" href="distribuidores.html" data-i18n="form.switchRole"></a></p>

    <form class="d-form" id="frm" novalidate>
      <div id="frm-sections"></div>

      <label class="d-consent">
        <input type="checkbox" id="frm-consent">
        <span data-i18n="form.consent"></span>
      </label>

      <div class="d-form-error" id="frm-error" hidden></div>

      <div class="d-form-foot">
        <button type="submit" class="d-btn primary" data-i18n="form.submit"></button>
        <span class="d-privacy" data-i18n="form.privacy"></span>
      </div>
      <div class="d-note" data-i18n="form.previewNote"></div>
    </form>
  </section>

  <!-- ============ VISTA 3: enviado ============ -->
  <section id="view-sent" hidden>
    <div class="d-success">
      <h2 data-i18n="form.sent.t"></h2>
      <p id="sent-msg"></p>
    </div>
    <p id="sent-trial" hidden style="margin-top:16px">
      <span data-i18n="form.sent.trialHint"></span>
      <a class="d-btn small" href="descargas.html" data-i18n="pub.demo.trialBtn" style="margin-left:8px"></a>
    </p>
    <p style="margin-top:22px"><a class="d-btn" href="/" data-i18n="back"></a></p>
  </section>

  <!-- ============ VISTA 4: no califica (amable) ============ -->
  <section id="view-declined" hidden>
    <div class="d-note" style="border-left-color:var(--royal);background:var(--gray-100);color:var(--gray-700);padding:22px 24px">
      <h2 style="margin:0 0 8px;font-size:19px;color:var(--navy)" data-i18n="decl.t"></h2>
      <p id="decl-body" style="margin:0 0 14px"></p>
      <p id="decl-reasons-label" style="margin:0 0 6px;font-weight:600" hidden></p>
      <ul id="decl-reasons" style="margin:0;padding-left:20px"></ul>
      <p style="margin:14px 0 0;font-size:12.5px;color:var(--gray-500)" data-i18n="decl.retry"></p>
    </div>
    <p style="margin-top:22px"><a class="d-btn" href="/" data-i18n="back"></a></p>
  </section>

  <p class="d-foot"><a href="/" data-i18n="back"></a></p>
</main>

<script src="assets/js/distribuidores-i18n.js"></script>
<script src="assets/js/solicitud-form.js"></script>
<script src="assets/js/socios-chat.js"></script>
<script>
(function () {
  "use strict";
  var T = window.DistI18n;
  var WORKER = "https://ledyvas-license-server.ledyvas.workers.dev";
  var params = new URLSearchParams(location.search);
  var rawRole = params.get("rol");
  var role = (rawRole === "vendedor" || rawRole === "distribuidor") ? rawRole : null;

  function applyStaticI18n() {
    document.documentElement.lang = T.lang();
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = T.t(el.getAttribute("data-i18n"));
    });
  }

  function renderLang() {
    var box = document.getElementById("pg-lang");
    box.innerHTML = "";
    T.SUPPORTED.forEach(function (code) {
      var b = document.createElement("button");
      b.textContent = code;
      if (code === T.lang()) b.setAttribute("aria-current", "true");
      b.addEventListener("click", function () { T.setLang(code); });
      box.appendChild(b);
    });
  }

  function show(id) {
    ["view-choose", "view-form", "view-sent", "view-declined"].forEach(function (v) {
      document.getElementById(v).hidden = (v !== id);
    });
  }

  // ---- field renderer ----
  function fieldEl(f) {
    var wrap = document.createElement("div");
    wrap.className = "d-field wide";

    var label = document.createElement("label");
    label.textContent = T.t(f.k);
    if (f.req) {
      var star = document.createElement("span");
      star.className = "d-req"; star.textContent = "*";
      star.title = T.t("form.required");
      label.appendChild(star);
    }
    wrap.appendChild(label);

    var input;
    if (f.type === "select") {
      input = document.createElement("select");
      var ph = document.createElement("option");
      ph.value = ""; ph.textContent = "—";
      input.appendChild(ph);
      (f.opts || []).forEach(function (ok) {
        var o = document.createElement("option");
        o.value = ok; o.textContent = T.t(ok);
        input.appendChild(o);
      });
    } else if (f.type === "textarea") {
      input = document.createElement("textarea");
    } else {
      input = document.createElement("input");
      input.type = (f.type === "file") ? "file" : f.type;
    }
    input.name = f.n;
    if (f.req) input.required = true;
    wrap.appendChild(input);

    if (f.hint) {
      var hint = document.createElement("span");
      hint.className = "d-hint";
      hint.textContent = T.t(f.hint);
      wrap.appendChild(hint);
    }
    return wrap;
  }

  var SCREEN_KEYS = [];

  function renderForm() {
    document.getElementById("frm-intro").textContent = T.t("form.intro." + role);
    var host = document.getElementById("frm-sections");
    host.innerHTML = "";
    window.SolicitudForm.get(role).forEach(function (sec) {
      var box = document.createElement("div");
      box.className = "d-form-sec";
      var h = document.createElement("h3");
      h.textContent = T.t(sec.sec);
      box.appendChild(h);
      var grid = document.createElement("div");
      grid.className = "d-form-grid";
      sec.fields.forEach(function (f) { grid.appendChild(fieldEl(f)); });
      box.appendChild(grid);
      host.appendChild(box);
    });

    // ---- sección de pre-evaluación (5 preguntas, texto libre) ----
    SCREEN_KEYS = window.SolicitudForm.screening(role);
    var sbox = document.createElement("div");
    sbox.className = "d-form-sec";
    var sh = document.createElement("h3");
    sh.textContent = T.t("scr.sec");
    var si = document.createElement("p");
    si.className = "d-hint"; si.style.marginTop = "2px";
    si.textContent = T.t("scr.intro");
    sbox.appendChild(sh); sbox.appendChild(si);
    var sgrid = document.createElement("div");
    sgrid.className = "d-form-grid";
    SCREEN_KEYS.forEach(function (qk, i) {
      sgrid.appendChild(fieldEl({ n: "scr_" + (i + 1), k: qk, type: "textarea", req: true }));
    });
    sbox.appendChild(sgrid);
    host.appendChild(sbox);
  }

  var MAX_FILE_BYTES = 4 * 1024 * 1024;

  function collectAllFields(form) {
    var out = {};
    window.SolicitudForm.get(role).forEach(function (sec) {
      sec.fields.forEach(function (f) {
        if (f.type === "file") return;
        var el = form.elements[f.n];
        if (!el) return;
        var v = String(el.value || "").trim();
        if (!v) return;
        out[f.n] = (el.tagName === "SELECT") ? T.t(el.value) : v;
      });
    });
    return out;
  }

  function readFiles(form) {
    var jobs = [];
    window.SolicitudForm.get(role).forEach(function (sec) {
      sec.fields.forEach(function (f) {
        if (f.type !== "file") return;
        var el = form.elements[f.n];
        if (!el || !el.files || !el.files.length) return;
        var file = el.files[0];
        if (file.size > MAX_FILE_BYTES) { jobs.push(Promise.reject({ tooBig: f.n })); return; }
        jobs.push(new Promise(function (resolve, reject) {
          var fr = new FileReader();
          fr.onload = function () {
            var s = String(fr.result || "");
            var i = s.indexOf(",");
            resolve({ filename: file.name || f.n, dataB64: i >= 0 ? s.slice(i + 1) : "" });
          };
          fr.onerror = function () { reject({ readFail: f.n }); };
          fr.readAsDataURL(file);
        }));
      });
    });
    return Promise.all(jobs);
  }

  function screenAnswers(form) {
    return SCREEN_KEYS.map(function (qk, i) {
      return { q: T.t(qk), a: String((form.elements["scr_" + (i + 1)] || {}).value || "").trim() };
    });
  }

  function roleName() { return T.t("admin.app.role." + role); }

  function goSent(form, verdict) {
    var email = (form.elements["email"] && form.elements["email"].value) || "—";
    document.getElementById("sent-msg").textContent =
      T.t("form.sent.d", { email: email }) +
      (verdict === "apto" ? "  " + T.t("scr.result.apto") : "");
    // La prueba gratis queda disponible para el distribuidor una vez enviada
    // y evaluada la solicitud (mientras espera la aprobación final).
    document.getElementById("sent-trial").hidden = (role !== "distribuidor");
    show("view-sent");
    window.scrollTo(0, 0);
  }

  function goDeclined(reasons) {
    document.getElementById("decl-body").textContent = T.t("decl.body", { role: roleName() });
    var ul = document.getElementById("decl-reasons");
    var lbl = document.getElementById("decl-reasons-label");
    ul.innerHTML = "";
    var list = Array.isArray(reasons) ? reasons.filter(Boolean).slice(0, 3) : [];
    if (list.length) {
      lbl.textContent = T.t("decl.reasons");
      lbl.hidden = false;
      list.forEach(function (r) {
        var li = document.createElement("li");
        li.style.marginBottom = "4px";
        li.textContent = r;
        ul.appendChild(li);
      });
    } else {
      lbl.hidden = true;
    }
    show("view-declined");
    window.scrollTo(0, 0);
  }

  function bindForm() {
    var form = document.getElementById("frm");
    var btn = form.querySelector("button[type=submit]");
    var busy = false;

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (busy) return;
      var err = document.getElementById("frm-error");
      err.hidden = true;

      var missing = window.SolicitudForm.get(role).some(function (sec) {
        return sec.fields.some(function (f) {
          if (!f.req) return false;
          var el = form.elements[f.n];
          if (!el) return false;
          if (f.type === "file") return !el.files || !el.files.length;
          return !String(el.value || "").trim();
        });
      });
      var answers = screenAnswers(form);
      var scrMissing = answers.filter(function (x) {
        return x.a.replace(/\s+/g, " ").length >= 40;
      }).length < answers.length;
      var consent = document.getElementById("frm-consent").checked;

      if (missing || !consent) {
        err.textContent = T.t("form.missing"); err.hidden = false;
        err.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      if (scrMissing) {
        err.textContent = T.t("scr.missing"); err.hidden = false;
        err.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }

      // La solicitud va al Worker (/apply): guarda + evalúa con IA + avisa a Ledyvas.
      busy = true;
      var origLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = T.t("scr.evaluating");

      function fail(msg) {
        err.textContent = msg; err.hidden = false;
        err.scrollIntoView({ behavior: "smooth", block: "center" });
        busy = false; btn.disabled = false; btn.textContent = origLabel;
      }

      readFiles(form).then(function (files) {
        var fields = collectAllFields(form);
        return fetch(WORKER + "/apply", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ role: role, lang: T.lang(), fields: fields, answers: answers, files: files })
        });
      })
        .then(function (r) { return r.ok ? r.json() : r.json().catch(function () { return null; }); })
        .then(function (j) {
          if (j && j.ok && j.veredicto === "no_cumple") {
            goDeclined(j.motivos_candidato);
          } else {
            goSent(form, (j && j.ok && j.veredicto) ? j.veredicto : null);
          }
          busy = false; btn.disabled = false; btn.textContent = origLabel;
        })
        .catch(function (e) {
          if (e && e.tooBig) { fail(T.t("form.fileTooBig")); return; }
          // Si el Worker no respondió, igual damos por enviada la solicitud
          // (no perdemos al candidato por un problema técnico puntual).
          goSent(form, null);
          busy = false; btn.disabled = false; btn.textContent = origLabel;
        });
    });
  }

  // ---- boot ----
  applyStaticI18n();
  renderLang();

  if (role) {
    document.getElementById("pg-title").textContent = T.t("form.title." + role);
    document.getElementById("pg-sub").textContent = "";
    document.title = T.t("form.title." + role) + " — Ledyvas";
    renderForm();
    bindForm();
    show("view-form");
  } else {
    document.getElementById("pg-title").textContent = T.t("pub.title");
    document.getElementById("pg-sub").textContent = T.t("pub.role.q");
    document.title = T.t("pub.title") + " — Ledyvas";
    show("view-choose");
  }
})();
</script>
</body>
</html>
