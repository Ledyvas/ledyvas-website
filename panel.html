<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel del Distribuidor — Ledyvas</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/distribuidores.css">
</head>
<body>

<div class="d-preview" data-i18n="previewBanner"></div>

<header class="d-header">
  <div class="d-wrap">
    <div>
      <div class="d-brand">
        <img src="assets/img/logo-icon.png" alt="Ledyvas">
        <div class="d-brand-txt">Ledyvas<span data-i18n="panel.title"></span></div>
      </div>
      <h1 data-i18n="panel.title"></h1>
      <p class="d-sub" id="pnl-hi"></p>
      <div class="d-code"><span data-i18n="panel.code"></span>: <b id="pnl-code">—</b></div>
    </div>
    <div class="d-lang" id="pnl-lang"></div>
  </div>
</header>

<main class="d-wrap">

  <div class="d-card" style="border-left:3px solid var(--gold, #C89B3C)">
    <div class="d-card-head"><h2 data-i18n="panel.download.t"></h2></div>
    <div style="padding:6px 20px 20px">
      <p data-i18n="panel.download.d"></p>
      <p style="margin-top:12px"><a class="d-btn primary" id="pnl-download" href="https://pub-8dcad4b6608142179f9dfe39891860d0.r2.dev/Ledyvas-Setup-0.1.4.exe" data-i18n="panel.download.btn"></a></p>
    </div>
  </div>

  <div class="d-kpis" id="pnl-kpis"></div>

  <div class="d-card">
    <div class="d-card-head"><h2 data-i18n="panel.clients"></h2></div>
    <div class="d-table-scroll">
      <table class="d-table">
        <thead>
          <tr>
            <th data-i18n="panel.col.date"></th>
            <th data-i18n="panel.col.product"></th>
            <th data-i18n="panel.col.status"></th>
            <th data-i18n="panel.col.activity"></th>
            <th class="num" data-i18n="panel.col.commission"></th>
          </tr>
        </thead>
        <tbody id="pnl-rows"></tbody>
      </table>
    </div>
    <div class="d-card-note" data-i18n="panel.commNote"></div>
  </div>

  <p class="d-foot">
    <span data-i18n="panel.help"></span><br>
    <a href="/" data-i18n="back"></a>
  </p>
</main>

<script src="assets/js/distribuidores-i18n.js"></script>
<script>
(function () {
  "use strict";
  var T = window.DistI18n;

  // ------------------------------------------------------------------
  // DATOS — hoy son de ejemplo. Después del 27-sep esto se reemplaza por:
  //   fetch("https://<worker>/panel?t=" + token).then(r => r.json())
  // El Worker de licencias ya ve cada descarga/venta/activación; sólo hay
  // que exponerlas agregadas por código de distribuidor.
  // ------------------------------------------------------------------
  var token = new URLSearchParams(location.search).get("t") || "DEMO-TOKEN";

  var DATA = {
    distributor: { name: "María Reyes", code: "MARIA-DR" },
    kpis: {
      downloads30: 14, downloadsTotal: 61,
      salesMonth: 3, salesTotal: 11,
      commEarned: 2235, commPaid: 1490, commPending: 745
    },
    clients: [
      { date: "2026-09-02", product: "horeca",  status: "active",   day: null, activity: "2026-09-05", commission: 374 },
      { date: "2026-09-01", product: "simple",  status: "trial",    day: 9,    activity: "2026-09-05", commission: 0 },
      { date: "2026-08-28", product: "turismo", status: "active",   day: null, activity: "2026-09-04", commission: 374 },
      { date: "2026-08-25", product: "horeca",  status: "trial",    day: 12,   activity: "2026-08-30", commission: 0 },
      { date: "2026-08-20", product: "simple",  status: "expired",  day: null, activity: "2026-08-27", commission: 0 },
      { date: "2026-08-18", product: "simple",  status: "never",    day: null, activity: "2026-08-18", commission: 0 },
      { date: "2026-08-11", product: "turismo", status: "active",   day: null, activity: "2026-09-03", commission: 374 }
    ]
  };

  function money(n) { return T.t("money") + " " + Number(n || 0).toLocaleString(T.lang() === "en" ? "en-US" : T.lang()); }
  function fmtDate(iso) {
    try { return new Date(iso + "T00:00:00").toLocaleDateString(T.lang() === "en" ? "en-GB" : T.lang(), { day: "2-digit", month: "short", year: "numeric" }); }
    catch (e) { return iso; }
  }

  function applyStaticI18n() {
    document.documentElement.lang = T.lang();
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = T.t(el.getAttribute("data-i18n")); });
    document.title = T.t("panel.title") + " — Ledyvas";
  }

  function renderLang() {
    var box = document.getElementById("pnl-lang");
    box.innerHTML = "";
    T.SUPPORTED.forEach(function (code) {
      var b = document.createElement("button");
      b.textContent = code;
      if (code === T.lang()) b.setAttribute("aria-current", "true");
      b.addEventListener("click", function () { T.setLang(code); });
      box.appendChild(b);
    });
  }

  function renderHeader() {
    document.getElementById("pnl-hi").textContent = T.t("panel.hi", { name: DATA.distributor.name });
    document.getElementById("pnl-code").textContent = DATA.distributor.code;
  }

  function renderKpis() {
    var k = DATA.kpis;
    var defs = [
      { label: "panel.kpi.down30",     value: k.downloads30 },
      { label: "panel.kpi.downTotal",  value: k.downloadsTotal },
      { label: "panel.kpi.salesMonth", value: k.salesMonth, cls: "accent" },
      { label: "panel.kpi.salesTotal", value: k.salesTotal, cls: "accent" },
      { label: "panel.kpi.commEarned", value: money(k.commEarned) },
      { label: "panel.kpi.commPaid",   value: money(k.commPaid), cls: "good" },
      { label: "panel.kpi.commPending",value: money(k.commPending), cls: "warn" }
    ];
    var grid = document.getElementById("pnl-kpis");
    grid.innerHTML = "";
    defs.forEach(function (d) {
      var card = document.createElement("div");
      card.className = "d-kpi" + (d.cls ? " " + d.cls : "");
      card.innerHTML = '<div class="k-label"></div><div class="k-value"></div>';
      card.querySelector(".k-label").textContent = T.t(d.label);
      card.querySelector(".k-value").textContent = d.value;
      grid.appendChild(card);
    });
  }

  function statusCell(c) {
    var span = document.createElement("span");
    if (c.status === "trial") { span.className = "d-badge trial"; span.textContent = T.t("panel.status.trial", { n: c.day }); }
    else if (c.status === "active") { span.className = "d-badge active"; span.textContent = T.t("panel.status.active"); }
    else if (c.status === "expired") { span.className = "d-badge expired"; span.textContent = T.t("panel.status.expired"); }
    else { span.className = "d-badge never"; span.textContent = T.t("panel.status.never"); }
    return span;
  }

  function renderRows() {
    var tb = document.getElementById("pnl-rows");
    tb.innerHTML = "";
    if (!DATA.clients.length) {
      tb.innerHTML = '<tr><td colspan="5"><div class="d-empty">' + T.t("panel.empty") + "</div></td></tr>";
      return;
    }
    DATA.clients.forEach(function (c) {
      var tr = document.createElement("tr");
      var tdDate = document.createElement("td"); tdDate.textContent = fmtDate(c.date);
      var tdProd = document.createElement("td"); tdProd.textContent = T.t("product." + c.product);
      var tdStat = document.createElement("td"); tdStat.appendChild(statusCell(c));
      var tdAct = document.createElement("td"); tdAct.textContent = fmtDate(c.activity);
      var tdComm = document.createElement("td"); tdComm.className = "num"; tdComm.textContent = c.commission ? money(c.commission) : "—";
      tr.appendChild(tdDate); tr.appendChild(tdProd); tr.appendChild(tdStat); tr.appendChild(tdAct); tr.appendChild(tdComm);
      tb.appendChild(tr);
    });
  }

  applyStaticI18n();
  renderLang();
  renderHeader();
  renderKpis();
  renderRows();
})();
</script>
</body>
</html>
